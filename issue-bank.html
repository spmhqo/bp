<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <meta name="description" content="Unfold Actuality — 60 AI Diagnostic Terms: Complete Hierarchy">
  <title>Unfold Actuality — 60 AI Diagnostic Terms</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14251f;
      --muted: #5d6d65;
      --paper: #f5f7f4;
      --surface: #fff;
      --line: #dce5df;
      --green: #176b4a;
      --green-dark: #104c37;
      --mint: #e9f4ed;
      --gold: #e4a64b;
      --shadow: 0 18px 48px rgba(19, 54, 38, .07);
      font-family: Inter, "Noto Sans Bengali", "Nirmala UI", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.7; }
    .wrap { width: min(100% - 44px, 1280px); margin-inline: auto; }
    .masthead { padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--green-dark); font-weight: 800; letter-spacing: .02em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; color: white; background: var(--green); font-size: .9rem; }
    main { padding: clamp(28px, 5vw, 64px) 0 76px; }
    .hero { position: relative; overflow: hidden; padding: clamp(28px, 6vw, 68px); border-radius: 28px; color: white; background: radial-gradient(circle at 85% 20%, rgba(133, 201, 156, .27), transparent 26%), linear-gradient(130deg, #123f30, #176b4a 72%, #32845e); box-shadow: var(--shadow); }
    .hero::after { content: "60"; position: absolute; right: 4%; bottom: -22%; color: rgba(255,255,255,.055); font-size: clamp(12rem, 30vw, 25rem); line-height: 1; font-weight: 900; letter-spacing: -.1em; pointer-events: none; }
    .eyebrow { margin: 0 0 12px; color: #b8dfc8; font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { position: relative; z-index: 1; max-width: 900px; margin: 0; font-size: clamp(2.25rem, 7vw, 5.6rem); line-height: 1.08; letter-spacing: -.055em; }
    .hero p:last-child { position: relative; z-index: 1; max-width: 690px; margin: 18px 0 0; color: #e2f0e7; font-size: clamp(1rem, 2vw, 1.2rem); }
    .content { margin-top: 28px; }
    .content > h1, .content > h2 { scroll-margin-top: 20px; }
    .content > h1 { margin: 54px 0 20px; padding-bottom: 15px; border-bottom: 2px solid var(--line); font-size: clamp(1.75rem, 4vw, 2.65rem); line-height: 1.2; letter-spacing: -.04em; }
    .content > h2 { margin: 54px 0 18px; font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.25; letter-spacing: -.03em; }
    .content > h3 { margin: 38px 0 12px; font-size: clamp(1.15rem, 2.4vw, 1.45rem); line-height: 1.35; }
    .content p { max-width: 900px; margin: 14px 0; }
    .content strong { color: var(--green-dark); }
    .content blockquote { margin: 22px 0; padding: 14px 20px; border-left: 4px solid var(--gold); border-radius: 0 12px 12px 0; background: #fff8e9; }
    .content blockquote p { margin: 0; }
    .content hr { height: 1px; margin: 42px 0; border: 0; background: var(--line); }
    .table-card { margin: 22px 0 34px; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .table-scroll { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; line-height: 1.55; }
    thead { color: white; background: var(--green-dark); }
    th { padding: 14px 13px; text-align: left; vertical-align: top; font-size: .78rem; font-weight: 750; letter-spacing: .025em; }
    td { padding: 12px 13px; border-top: 1px solid #e8eeea; vertical-align: top; }
    tbody tr:nth-child(even) { background: #f8fbf8; }
    td:first-child, th:first-child { width: 1%; white-space: nowrap; text-align: right; }
    td strong { color: var(--green-dark); }
    .content ul, .content ol { max-width: 940px; padding-left: 1.4rem; }
    .content li { margin: 6px 0; }
    .content > p:first-of-type { color: var(--muted); }
    footer { padding: 25px 0 32px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: .82rem; }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 30px, 1280px); }
      .masthead { padding: 20px 0; }
      .hero { border-radius: 20px; }
      .table-card { overflow: visible; border: 0; background: transparent; box-shadow: none; }
      .table-scroll { overflow: visible; }
      table, tbody { display: block; width: 100%; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
      tbody { display: grid; gap: 12px; }
      tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface) !important; box-shadow: 0 7px 20px rgba(19,54,38,.045); }
      tbody td { display: block; min-width: 0; padding: 9px 0; border-top: 0; overflow-wrap: anywhere; }
      tbody td::before { content: attr(data-label); display: block; margin-bottom: 3px; color: var(--muted); font-size: .67rem; font-weight: 800; letter-spacing: .055em; text-transform: uppercase; }
      tbody td:first-child { width: auto; white-space: normal; text-align: left; }
      tbody td:first-child::before { content: "#"; }
      tbody td:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 430px) {
      .wrap { width: min(100% - 24px, 1280px); }
      .brand { font-size: .9rem; }
      .hero { padding: 25px 20px; }
      .content > h1 { margin-top: 42px; }
      tbody tr { grid-template-columns: 1fr; }
      tbody td:last-child { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

  <script>
    async function renderContent() {
      const encoded = document.getElementById("source-data").textContent.trim();
      const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const source = await new Response(stream).text();
      const root = document.getElementById("content");

      const escapeHtml = value => value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[char]));

      function inline(text) {
        return escapeHtml(text)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function splitRow(line) {
        return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
      }

      function isTableLine(line) { return /^\s*\|.*\|\s*$/.test(line); }
      function isSeparator(line) { return /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes("-"); }

      const lines = source.replace(/\r/g, "").split("\n");
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();

        if (!line) { i++; continue; }
        if (line === "Unfold Actuality — 60 AI Diagnostic Terms: Complete Hierarchy") { i++; continue; }

        if (isTableLine(lines[i])) {
          const rawRows = [];
          while (i < lines.length && isTableLine(lines[i])) {
            if (!isSeparator(lines[i])) rawRows.push(splitRow(lines[i]));
            i++;
          }

          const headers = rawRows.shift() || [];
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");

          headers.forEach(value => {
            const th = document.createElement("th");
            th.innerHTML = inline(value);
            headRow.appendChild(th);
          });

          thead.appendChild(headRow);
          const tbody = document.createElement("tbody");

          rawRows.forEach(row => {
            const tr = document.createElement("tr");
            headers.forEach((header, index) => {
              const td = document.createElement("td");
              td.dataset.label = header.replace(/\*\*/g, "");
              td.innerHTML = inline(row[index] || "");
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });

          table.append(thead, tbody);
          const card = document.createElement("div");
          card.className = "table-card";
          const scroller = document.createElement("div");
          scroller.className = "table-scroll";
          scroller.appendChild(table);
          card.appendChild(scroller);
          root.appendChild(card);
          continue;
        }

        if (/^---+$/.test(line)) {
          root.appendChild(document.createElement("hr"));
          i++;
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const el = document.createElement("h" + heading[1].length);
          el.innerHTML = inline(heading[2]);
          root.appendChild(el);
          i++;
          continue;
        }

        if (/^>\s?/.test(line)) {
          const quote = document.createElement("blockquote");
          const p = document.createElement("p");
          p.innerHTML = inline(line.replace(/^>\s?/, ""));
          quote.appendChild(p);
          root.appendChild(quote);
          i++;
          continue;
        }

        if (/^[-*]\s+/.test(line)) {
          const list = document.createElement("ul");
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            const li = document.createElement("li");
            li.innerHTML = inline(lines[i].replace(/^\s*[-*]\s+/, ""));
            list.appendChild(li);
            i++;
          }
          root.appendChild(list);
          continue;
        }

        const p = document.createElement("p");
        p.innerHTML = inline(line);
        root.appendChild(p);
        i++;
      }
    }

    renderContent();
  </script>
