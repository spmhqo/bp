(async()=>{const md=await sourceText();const chunks=md.split(/(?=^\*\*You:\*\*\s*$|^\*\*ChatGPT:\*\*\s*$)/m).filter(x=>x.trim());let pi=0,ri=0;for(const chunk of chunks){const isPrompt=/^\*\*You:\*\*/.test(chunk);const label=isPrompt?`Prompt ${++pi}`:'Response';const id=isPrompt?`prompt-${pi}`:`response-${++ri}`;const section=document.createElement('section');section.className='turn'+(isPrompt?' prompt':'');section.id=id;const content=chunk.replace(/^\*\*(?:You|ChatGPT):\*\*\s*/,'').trim();section.innerHTML=`<h2>${label}</h2>${isPrompt?'<button class="copy" type="button">Copy Prompt</button>':''}<div class="body">${render(content)}</div>`;if(isPrompt)section.querySelector('.copy').addEventListener('click',async e=>{await navigator.clipboard.writeText(content);e.currentTarget.textContent='Copied!';setTimeout(()=>e.currentTarget.textContent='Copy Prompt',1600)});document.querySelector('#content').append(section);if(isPrompt){const a=document.createElement('a');a.href='#'+id;a.textContent=label+': '+content.replace(/\s+/g,' ').slice(0,70)+(content.length>70?'…':'');document.querySelector('#prompt-nav').append(a)}}})();
