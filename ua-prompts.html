<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f4">
  <meta name="description" content="AI Diagnostic Prompt Library: Work System versus Self System">
  <title>AI Diagnostic Prompt Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17241e;
      --muted: #617067;
      --paper: #f3f6f3;
      --surface: #fff;
      --line: #dce5de;
      --green: #176847;
      --green-dark: #104a34;
      --green-pale: #e8f2eb;
      --gold: #d99a3f;
      --shadow: 0 12px 34px rgba(24, 54, 39, .07);
      font-family: Inter, "Noto Sans Bengali", "Nirmala UI", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; background: var(--paper); }
    body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.7; }
    .wrap { width: min(100% - 40px, 1120px); margin-inline: auto; }
    .masthead { padding: 22px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; color: var(--green-dark); font-weight: 800; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 11px; color: white; background: var(--green); font-size: .8rem; }
    main { padding: clamp(28px, 5vw, 60px) 0 76px; }
    .hero { padding: clamp(28px, 6vw, 60px); border-radius: 24px; color: white; background: radial-gradient(circle at 85% 18%, rgba(133,201,156,.24), transparent 28%), linear-gradient(130deg, #123e2e, #176847 75%, #32835c); box-shadow: var(--shadow); }
    .eyebrow { margin: 0 0 10px; color: #b8dfc8; font-size: .74rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 4.8rem); line-height: 1.08; letter-spacing: -.055em; }
    .hero p:last-child { max-width: 700px; margin: 16px 0 0; color: #e3f0e7; font-size: clamp(1rem, 2vw, 1.16rem); }
    .prompt-nav { margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .prompt-nav summary { padding: 16px 20px; color: var(--green-dark); cursor: pointer; font-weight: 800; }
    .nav-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 360px; overflow: auto; padding: 0 18px 18px; }
    .nav-links a { display: flex; gap: 9px; align-items: baseline; min-width: 0; padding: 8px 10px; border-radius: 9px; color: var(--ink); background: #f5f8f5; text-decoration: none; font-size: .85rem; line-height: 1.4; }
    .nav-links a:hover, .nav-links a:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; background: var(--green-pale); }
    .nav-number { flex: 0 0 auto; color: var(--green); font-size: .72rem; font-weight: 850; }
    .content { margin-top: 42px; }
    .content > h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; }
    .content > h2 { margin: 30px 0 10px; font-size: clamp(1.35rem, 3vw, 1.85rem); line-height: 1.3; }
    .content > h3 { margin: 26px 0 8px; font-size: 1.15rem; }
    .content p { margin: 10px 0; }
    .content strong { color: var(--green-dark); }
    .content hr { height: 1px; margin: 32px 0; border: 0; background: var(--line); }
    .content blockquote { margin: 16px 0; padding: 10px 18px; border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0; background: #fff8ea; }
    .content blockquote p { margin: 0; }
    .prompt-section { scroll-margin-top: 18px; margin: 26px 0; padding: clamp(19px, 3.6vw, 30px); border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .prompt-section > h2 { margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: clamp(1.35rem, 3vw, 1.8rem); line-height: 1.3; }
    .prompt-box { margin-top: 18px; overflow: hidden; border: 1px solid #233c31; border-radius: 13px; background: #11231b; }
    .prompt-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid rgba(255,255,255,.12); color: #b9d4c3; font-size: .73rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .copy-button { min-height: 38px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; color: white; background: #226344; cursor: pointer; font: inherit; font-size: .76rem; letter-spacing: 0; text-transform: none; transition: background .15s ease, transform .15s ease; }
    .copy-button:hover { background: #2c8057; }
    .copy-button:active { transform: translateY(1px); }
    .copy-button:focus-visible { outline: 3px solid #f1c879; outline-offset: 2px; }
    pre { max-width: 100%; margin: 0; padding: 18px; overflow-x: auto; color: #eff7f1; font: 400 .9rem/1.72 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; tab-size: 2; white-space: pre-wrap; overflow-wrap: anywhere; }
    code { font: inherit; }
    footer { padding: 24px 0 32px; border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: .8rem; }
    @media (max-width: 760px) {
      .wrap { width: min(100% - 28px, 1120px); }
      .hero { border-radius: 19px; }
      .nav-links { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 46vh; }
    }
    @media (max-width: 460px) {
      .wrap { width: min(100% - 22px, 1120px); }
      .masthead { padding: 16px 0; }
      .nav-links { grid-template-columns: 1fr; padding-inline: 12px; }
      .prompt-section { padding: 17px 13px; border-radius: 14px; }
      .prompt-toolbar { padding-left: 11px; }
      .copy-button { min-height: 42px; }
      pre { padding: 14px 12px; font-size: .82rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .copy-button { transition: none; } }
  </style>
</head>

  <script>
    async function renderLibrary() {
      const encoded = document.getElementById("source-data").textContent.trim();
      const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      const source = await new Response(stream).text();
      const root = document.getElementById("content");
      const nav = document.getElementById("prompt-links");
      const escapeHtml = value => value.replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
      function inline(text) {
        return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
      }
      const lines = source.replace(/\r/g, "").split("\n");
      const promptHeadings = lines.map(line => line.match(/^##\s+(\d+)\.\s+(.+)$/)).filter(Boolean);
      promptHeadings.forEach(match => {
        const link = document.createElement("a");
        link.href = "#prompt-" + match[1];
        const number = document.createElement("span");
        number.className = "nav-number";
        number.textContent = match[1].padStart(2, "0");
        const label = document.createElement("span");
        label.textContent = match[2];
        link.append(number, label);
        nav.appendChild(link);
      });
      let currentPrompt = null;
      let i = 0;
      while (i < lines.length) {
        const line = lines[i].trim();
        if (!line) { i++; continue; }
        if (/^```/.test(line)) {
          i++;
          const promptLines = [];
          while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) promptLines.push(lines[i++]);
          if (i < lines.length) i++;
          const promptText = promptLines.join("\n");
          const box = document.createElement("div");
          box.className = "prompt-box";
          const toolbar = document.createElement("div");
          toolbar.className = "prompt-toolbar";
          const label = document.createElement("span");
          label.textContent = "Prompt";
          const button = document.createElement("button");
          button.className = "copy-button";
          button.type = "button";
          button.textContent = "Copy Prompt";
          button.setAttribute("aria-label", "Copy Prompt");
          button.addEventListener("click", async () => {
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(promptText);
              } else {
                const area = document.createElement("textarea");
                area.value = promptText;
                area.setAttribute("readonly", "");
                area.style.position = "fixed";
                area.style.opacity = "0";
                document.body.appendChild(area);
                area.select();
                const copied = document.execCommand("copy");
                area.remove();
                if (!copied) throw new Error("Clipboard copy failed");
              }
              button.textContent = "Copied!";
              window.setTimeout(() => { button.textContent = "Copy Prompt"; }, 1500);
            } catch {
              button.textContent = "Copy failed";
              window.setTimeout(() => { button.textContent = "Copy Prompt"; }, 1800);
            }
          });
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = promptText;
          pre.appendChild(code);
          toolbar.append(label, button);
          box.append(toolbar, pre);
          (currentPrompt || root).appendChild(box);
          continue;
        }
        if (/^---+$/.test(line)) { root.appendChild(document.createElement("hr")); currentPrompt = null; i++; continue; }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          const promptHeading = level === 2 && heading[2].match(/^(\d+)\.\s+(.+)$/);
          if (promptHeading) {
            currentPrompt = document.createElement("section");
            currentPrompt.className = "prompt-section";
            currentPrompt.id = "prompt-" + promptHeading[1];
            const title = document.createElement("h2");
            title.textContent = promptHeading[1] + ". " + promptHeading[2];
            currentPrompt.appendChild(title);
            root.appendChild(currentPrompt);
          } else {
            currentPrompt = null;
            const el = document.createElement("h" + level);
            el.innerHTML = inline(heading[2]);
            root.appendChild(el);
          }
          i++;
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = document.createElement("blockquote");
          const p = document.createElement("p");
          p.innerHTML = inline(line.replace(/^>\s?/, ""));
          quote.appendChild(p);
          (currentPrompt || root).appendChild(quote);
          i++;
          continue;
        }
        if (/^\s*[-*]\s+/.test(lines[i])) {
          const list = document.createElement("ul");
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            const li = document.createElement("li");
            li.innerHTML = inline(lines[i].replace(/^\s*[-*]\s+/, ""));
            list.appendChild(li);
            i++;
          }
          (currentPrompt || root).appendChild(list);
          continue;
        }
        if (/^\s*\d+[.)]\s+/.test(lines[i])) {
          const list = document.createElement("ol");
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            const li = document.createElement("li");
            li.innerHTML = inline(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
            list.appendChild(li);
            i++;
          }
          (currentPrompt || root).appendChild(list);
          continue;
        }
        const p = document.createElement("p");
        p.innerHTML = inline(line);
        (currentPrompt || root).appendChild(p);
        i++;
      }
    }
    renderLibrary();
  </script>
</body>
</html>
